[pytest]
addopts = -s -v
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    courses: для тестов, связанных с курсами.
    dashboard: для тестов, связанных с рабочей панелью.
    regression: для регрессионных тестов.
    authorization: для тестов, связанных с авторизацией.
    registration: для тестов, связанных с регистрацией.